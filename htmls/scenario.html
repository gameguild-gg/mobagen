<!DOCTYPE html>
<html>

<head>

<!-- Cross-origin isolation (dynamic-loading-all-platforms todo 6):
     coi-serviceworker registers SYNCHRONOUSLY before any app script to gain
     COOP/COEP on static hosts (GitHub Pages). Chromium/Firefox: isolated after
     one automatic reload. Safari + first load pre-reload: NOT isolated, ever —
     the variant picker below then boots the isolated (SAB-less) engine bundle,
     so the page always boots. Deployment layout: / -> isolated tree,
     /shared/ -> shared tree (see mobagen_variant.js header comment). -->
<script src="coi-serviceworker.js"></script>
<script src="mobagen_variant.js"></script>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <style>
        #canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            margin: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
        }
    </style>
</head>

<body>

<!-- Create the canvas that the C++ code will draw into -->
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

<!-- Allow the C++ to access the canvas element -->
<script type='text/javascript'>
    var canvas = document.getElementById("canvas");
    //make the canvas fullscreen
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    canvas.oncontextmenu = function (e) {
        e.preventDefault();
    };

    //show Emscripten environment where the canvas is
    var Module = typeof Module !== "undefined" ? Module : {};
    Module.canvas = canvas;
</script>

<!-- Add the javascript glue code (index.js) as generated by Emscripten -->
<script data-mobagen-engine src="scenario.js"></script>

</body>

</html>
