<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DICOM Renderer - Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
        }

        #container {
            position: relative;
            width: 800px;
            height: 600px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a2a4a;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #000;
            border: 2px solid #0f0;
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
        }

        #controls h3 {
            color: #0f0;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #status {
            color: #0f0;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button {
            display: block;
            width: 200px;
            padding: 8px;
            margin: 5px 0;
            background: #1a1a1a;
            color: #888;
            border: 2px solid #444;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
        }

        button.active {
            background: #0a3a0a;
            color: #0f0;
            border-color: #0f0;
        }

        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #000;
            border: 2px solid #0f0;
            padding: 15px;
            border-radius: 5px;
            color: #0f0;
            font-size: 12px;
            text-align: right;
        }

        .shape {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>

        <div id="controls">
            <h3>🎮 RENDERER</h3>
            <div id="status">WebGL</div>
            <button id="btn-webgl" class="active" onclick="switchRenderer('webgl')">► WebGL: Triangle</button>
            <button id="btn-webgpu" onclick="switchRenderer('webgpu')">► WebGPU: Quad</button>

            <h3 style="margin-top: 15px;">🎨 COLORS</h3>
            <button id="color-1" class="active" onclick="switchColor(1)">1: Teal</button>
            <button id="color-2" onclick="switchColor(2)">2: Red</button>
            <button id="color-3" onclick="switchColor(3)">3: Green</button>
            <button id="color-4" onclick="switchColor(4)">4: Yellow</button>
        </div>

        <div id="stats">
            <div id="stat-renderer">Renderer: WebGL</div>
            <div id="stat-fps">FPS: 60</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        canvas.width = 800;
        canvas.height = 600;

        let currentRenderer = 'webgl';
        let currentColor = 1;

        const colors = {
            1: { r: 0, g: 255, b: 128, name: 'Teal' },
            2: { r: 255, g: 0, b: 0, name: 'Red' },
            3: { r: 0, g: 255, b: 0, name: 'Green' },
            4: { r: 255, g: 255, b: 0, name: 'Yellow' }
        };

        function drawTriangle(color) {
            ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
            ctx.beginPath();
            ctx.moveTo(400, 150);
            ctx.lineTo(300, 450);
            ctx.lineTo(500, 450);
            ctx.closePath();
            ctx.fill();
        }

        function drawQuad(color) {
            ctx.fillStyle = `rgb(${color.r}, ${color.g}, ${color.b})`;
            ctx.fillRect(250, 200, 300, 300);
        }

        function render() {
            // Clear
            ctx.fillStyle = '#1a2a4a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw shape
            const color = colors[currentColor];
            if (currentRenderer === 'webgl') {
                drawTriangle(color);
            } else {
                drawQuad(color);
            }

            // Update stats
            document.getElementById('stat-renderer').textContent =
                currentRenderer === 'webgl' ? 'Renderer: WebGL (G2)' : 'Renderer: WebGPU (G3)';
        }

        function switchRenderer(renderer) {
            currentRenderer = renderer;

            // Update buttons
            document.getElementById('btn-webgl').classList.toggle('active', renderer === 'webgl');
            document.getElementById('btn-webgpu').classList.toggle('active', renderer === 'webgpu');

            console.log(`✓ Switched to ${renderer.toUpperCase()}`);
            render();
        }

        function switchColor(num) {
            currentColor = num;

            // Update buttons
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`color-${i}`).classList.toggle('active', i === num);
            }

            console.log(`✓ Switched to ${colors[num].name}`);
            render();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') switchColor(1);
            if (e.key === '2') switchColor(2);
            if (e.key === '3') switchColor(3);
            if (e.key === '4') switchColor(4);
        });

        // Initial render
        render();
        console.log('DICOM Renderer Test - Ready!');
        console.log('Click buttons or press 1/2/3/4 for colors');
    </script>
</body>
</html>
