name: Windows

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  windows-native:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build (windows)
        run: python scripts/build.py windows

      # Windows has no wasi-sdk distribution, so the native-runtime (wasi)
      # guests are skipped by the module CMake gates; the WAMR backend core +
      # memory-shim suites still build and run here.
      - name: Run doctest suites
        run: ctest --test-dir build-windows -C MinSizeRel --output-on-failure

      - name: Upload module package trees
        uses: actions/upload-artifact@v4
        with:
          name: windows-modules
          path: build-windows/bin/plugins/

      - name: Release
        uses: fnkr/github-action-ghr@v1.3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHR_COMPRESS: zip
          GHR_PATH: build-windows/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
