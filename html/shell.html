<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DICOM Renderer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        button {
            padding: 6px 10px;
            margin: 2px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid;
            transition: all 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Performance Stats (Top Right) -->
    <div id="stats" style="position: fixed; top: 50px; right: 10px; z-index: 100; background: rgba(0,0,0,0.95); padding: 12px 15px; border-radius: 8px; font-family: monospace; color: #0f0; font-size: 12px; text-align: right; min-width: 220px; border: 1px solid #0f0;">
        <div style="margin-bottom: 6px;"><strong id="stat-renderer">Renderer: WebGL (G2)</strong></div>
        <div id="stat-fps" style="color: #0f0; font-weight: bold; margin-bottom: 4px;">FPS: 60</div>
        <div id="stat-frametime" style="color: #888; font-size: 10px;">Frame: 16.7ms</div>
    </div>

    <!-- Controls (Top Left) -->
    <div id="controls" style="position: fixed; top: 50px; left: 10px; z-index: 100; background: rgba(0,0,0,0.95); padding: 15px; border-radius: 8px; font-family: monospace; color: #0f0; max-width: 320px; border: 1px solid #0f0;">
        <!-- Renderer Selection -->
        <div style="margin-bottom: 14px; border-bottom: 1px solid #0f0; padding-bottom: 10px;">
            <div style="font-size: 11px; margin-bottom: 8px; color: #888;">
                ACTIVE RENDERER:<br><strong id="renderer-status" style="color: #0f0; font-size: 13px;">WebGL (G2)</strong>
            </div>
            <button id="btn-webgl" onclick="switchRenderer('webgl')" style="background: #0a3a0a; color: #0f0; border-color: #0f0; width: 100%; margin-bottom: 4px;">► WebGL (Immediate-Mode)</button>
            <button id="btn-webgpu" onclick="switchRenderer('webgpu')" style="background: #1a1a1a; color: #888; border-color: #444; width: 100%;">► WebGPU (Deferred-Mode)</button>
            <div style="font-size: 9px; color: #666; margin-top: 6px;">G2 = OpenGL ES 3.0 | G3 = Modern GPU API</div>
        </div>

        <!-- Shader Variants -->
        <div style="margin-bottom: 12px; border-bottom: 1px solid #0f0; padding-bottom: 10px;">
            <div style="font-size: 11px; margin-bottom: 6px; color: #888;">COLOR VARIANTS:</div>
            <button id="shader-1" onclick="switchShader(1)" style="background: #0a3a0a; color: #0f0; border-color: #0f0; width: calc(50% - 3px); margin-right: 5px;">Teal</button>
            <button id="shader-2" onclick="switchShader(2)" style="background: #1a1a1a; color: #888; border-color: #444; width: calc(50% - 3px);">Red</button>
            <br>
            <button id="shader-3" onclick="switchShader(3)" style="background: #1a1a1a; color: #888; border-color: #444; width: calc(50% - 3px); margin-right: 5px; margin-top: 4px;">Green</button>
            <button id="shader-4" onclick="switchShader(4)" style="background: #1a1a1a; color: #888; border-color: #444; width: calc(50% - 3px);">Yellow</button>
        </div>

        <!-- Info -->
        <div style="font-size: 9px; color: #666; line-height: 1.5;">
            <div style="color: #555;">Press 1/2/3/4 to switch colors</div>
            <div style="color: #555; margin-top: 4px;">Click renderer buttons to switch</div>
        </div>
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        var Module = { canvas: document.getElementById('canvas') };

        // ====================================================================
        // PERFORMANCE STATS TRACKING
        // ====================================================================
        class PerformanceStats {
            constructor() {
                this.frameCount = 0;
                this.lastTime = performance.now();
                this.lastFpsTime = this.lastTime;
                this.fps = 60;
                this.frameTime = 16.7;
                this.currentRenderer = 'webgl';
            }

            update() {
                const now = performance.now();
                const delta = now - this.lastTime;
                this.frameTime = delta;
                this.lastTime = now;
                this.frameCount++;

                // Update FPS every 500ms
                if (now - this.lastFpsTime >= 500) {
                    this.fps = Math.round((this.frameCount / (now - this.lastFpsTime)) * 1000);
                    this.frameCount = 0;
                    this.lastFpsTime = now;
                    this.updateDisplay();
                }
            }

            setRenderer(renderer) {
                this.currentRenderer = renderer;
                this.updateDisplay();
            }

            updateDisplay() {
                const rendererName = this.currentRenderer === 'webgl' ? 'WebGL (G2)' : 'WebGPU (G3)';
                const fpsColor = this.fps >= 55 ? '#0f0' : this.fps >= 30 ? '#ff0' : '#f00';

                document.getElementById('stat-renderer').textContent = `Renderer: ${rendererName}`;
                document.getElementById('stat-fps').textContent = `FPS: ${this.fps}`;
                document.getElementById('stat-fps').style.color = fpsColor;
                document.getElementById('stat-frametime').textContent = `Frame: ${this.frameTime.toFixed(1)}ms`;
            }
        }

        const stats = new PerformanceStats();
        stats.updateDisplay();

        // Update stats on every frame
        function statsLoop() {
            stats.update();
            requestAnimationFrame(statsLoop);
        }
        statsLoop();

        function switchRenderer(renderer) {
            console.log(`→ Switching to: ${renderer.toUpperCase()}`);
            if (typeof Module._set_renderer === 'function') {
                Module._set_renderer(renderer);
                stats.setRenderer(renderer);

                const displayName = renderer === 'webgl' ? 'WebGL (G2)' : 'WebGPU (G3)';
                document.getElementById('renderer-status').textContent = displayName;

                const btn_webgl = document.getElementById('btn-webgl');
                const btn_webgpu = document.getElementById('btn-webgpu');
                if (renderer === 'webgl') {
                    btn_webgl.style.background = '#0a3a0a';
                    btn_webgl.style.color = '#0f0';
                    btn_webgl.style.borderColor = '#0f0';
                    btn_webgpu.style.background = '#1a1a1a';
                    btn_webgpu.style.color = '#888';
                    btn_webgpu.style.borderColor = '#444';
                } else {
                    btn_webgpu.style.background = '#0a3a0a';
                    btn_webgpu.style.color = '#0f0';
                    btn_webgpu.style.borderColor = '#0f0';
                    btn_webgl.style.background = '#1a1a1a';
                    btn_webgl.style.color = '#888';
                    btn_webgl.style.borderColor = '#444';
                }
            }
        }

        function switchShader(variant) {
            console.log(`Switching shader to variant: ${variant}`);
            if (typeof Module._set_shader_variant === 'function') {
                Module._set_shader_variant(variant);

                // Update button styles for all shader buttons
                const names = ['Teal', 'Red', 'Green', 'Yellow'];
                const colors = ['#00ff80', '#ff0000', '#00ff00', '#ffff00'];

                for (let i = 1; i <= 4; i++) {
                    const btn = document.getElementById(`shader-${i}`);
                    if (i === variant) {
                        btn.style.background = '#0a3a0a';
                        btn.style.color = colors[i-1];
                        btn.style.borderColor = colors[i-1];
                        btn.style.textShadow = `0 0 5px ${colors[i-1]}`;
                    } else {
                        btn.style.background = '#1a1a1a';
                        btn.style.color = '#888';
                        btn.style.borderColor = '#444';
                        btn.style.textShadow = 'none';
                    }
                }
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Shader variants: 1/2/3/4
            if (e.key === '1') switchShader(1);
            if (e.key === '2') switchShader(2);
            if (e.key === '3') switchShader(3);
            if (e.key === '4') switchShader(4);
        });

        // Initialize shader buttons
        switchShader(1);

        console.log('═══════════════════════════════════════════');
        console.log('DICOM Renderer Controls:');
        console.log('─────────────────────────────────────────');
        console.log('Renderer Switch: Click buttons (WebGL/WebGPU)');
        console.log('Color Variants: Press 1/2/3/4 (or click)');
        console.log('═══════════════════════════════════════════');
    </script>
    <script>
// ============================================================================
// G3: WebGPU Deferred Rendering Implementation — Educational Code
// ============================================================================
function detectWebGPUSupport() {
    if (!navigator.gpu) {
        return {
            supported: false,
            browser: detectBrowser(),
            message: "WebGPU not available in this browser"
        };
    }
    return {
        supported: true,
        browser: detectBrowser(),
        message: "WebGPU supported!"
    };
}

function detectBrowser() {
    const ua = navigator.userAgent;
    if (ua.includes('Chrome') && !ua.includes('Chromium')) {
        return 'Chrome';
    } else if (ua.includes('Firefox')) {
        return 'Firefox';
    } else if (ua.includes('Safari') && !ua.includes('Chrome')) {
        return 'Safari';
    } else if (ua.includes('Edge')) {
        return 'Edge';
    }
    return 'Unknown';
}

function createWebGPUWarningElement() {
    const support = detectWebGPUSupport();
    const container = document.body;
    const warningDiv = document.createElement('div');
    warningDiv.id = 'webgpu-warning';
    warningDiv.style.cssText = `position: fixed; top: 10px; left: 50%; transform: translateX(-50%); padding: 8px 12px; background: #1a1a1a; color: #fff; font-family: monospace; font-size: 11px; z-index: 1000; border-radius: 4px; border: 1px solid #666; max-width: 400px;`;

    if (support.supported) {
        warningDiv.style.background = '#0a3a0a';
        warningDiv.style.borderColor = '#0f0';
        warningDiv.innerHTML = `<strong style="color: #0f0;">✓ WebGPU:</strong> Available (${support.browser})`;
    } else {
        warningDiv.style.background = '#3a0a0a';
        warningDiv.style.borderColor = '#f00';
        warningDiv.innerHTML = `<strong style="color: #f00;">⚠ WebGPU:</strong> Not available (${support.browser})`;
    }
    container.appendChild(warningDiv);
}

const WGSL_SHADER = `
struct VertexInput {
  @location(0) position: vec2f,
};

@vertex
fn vs_main(in: VertexInput) -> @builtin(position) vec4f {
  return vec4f(in.position, 0.0, 1.0);
}

@fragment
fn fs_main() -> @location(0) vec4f {
  return vec4f(0.0, 1.0, 0.5, 1.0);
}
`;

window.webgpuState = {
    device: null,
    queue: null,
    pipeline: null,
    vertexBuffer: null,
    canvas: document.getElementById('canvas'),
    context: null,
    initialized: false
};

async function initWebGPU() {
    if (window.webgpuState.initialized) return true;
    if (!navigator.gpu) {
        console.error("WebGPU not supported");
        return false;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            console.error("GPU adapter not found");
            return false;
        }

        const device = await adapter.requestDevice();
        window.webgpuState.device = device;
        window.webgpuState.queue = device.queue;

        const canvas = window.webgpuState.canvas;
        const context = canvas.getContext('webgpu');
        if (!context) {
            console.error("Could not get WebGPU context");
            return false;
        }

        const format = navigator.gpu.getPreferredCanvasFormat();
        context.configure({
            device: device,
            format: format,
        });
        window.webgpuState.context = context;
        window.webgpuState.format = format;

        const shader = device.createShaderModule({
            code: WGSL_SHADER
        });

        const vertices = new Float32Array([
            0.0,  0.5,
            -0.5, -0.5,
            0.5, -0.5
        ]);

        const vertexBuffer = device.createBuffer({
            size: vertices.byteLength,
            usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            mappedAtCreation: true,
        });
        new Float32Array(vertexBuffer.getMappedRange()).set(vertices);
        vertexBuffer.unmap();
        window.webgpuState.vertexBuffer = vertexBuffer;

        const pipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module: shader,
                entryPoint: 'vs_main',
                buffers: [{
                    arrayStride: 8,
                    attributes: [{
                        shaderLocation: 0,
                        offset: 0,
                        format: 'float32x2',
                    }],
                }],
            },
            fragment: {
                module: shader,
                entryPoint: 'fs_main',
                targets: [{ format: format }],
            },
            primitive: { topology: 'triangle-list' },
        });
        window.webgpuState.pipeline = pipeline;
        window.webgpuState.initialized = true;
        console.log("WebGPU initialized successfully");
        return true;
    } catch (e) {
        console.error("WebGPU initialization error:", e);
        return false;
    }
}

function renderFrame() {
    if (!window.webgpuState.device || !window.webgpuState.pipeline) return;

    const state = window.webgpuState;
    const device = state.device;
    const queue = state.queue;
    const context = state.context;

    const commandEncoder = device.createCommandEncoder();
    const textureView = context.getCurrentTexture().createView();
    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: textureView,
            clearValue: { r: 0.1, g: 0.2, b: 0.5, a: 1.0 },
            loadOp: 'clear',
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(state.pipeline);
    renderPass.setVertexBuffer(0, state.vertexBuffer);
    renderPass.draw(3, 1, 0, 0);
    renderPass.end();
    queue.submit([commandEncoder.finish()]);
}

window.addEventListener('DOMContentLoaded', () => {
    createWebGPUWarningElement();

    const support = detectWebGPUSupport();
    console.log(`WebGPU Support: ${support.supported ? '✓' : '✗'} (${support.browser})`);

    if (!support.supported) return;

    initWebGPU().then(success => {
        if (success) {
            console.log('WebGPU initialized successfully');
            const animLoop = () => {
                renderFrame();
                requestAnimationFrame(animLoop);
            };
            requestAnimationFrame(animLoop);
        } else {
            console.error('Failed to initialize WebGPU');
        }
    }).catch(e => {
        console.error('WebGPU initialization error:', e);
    });
});

window.webgpu_render = renderFrame;
window.webgpu_init = initWebGPU;
    </script>
    {{{ SCRIPT }}}
</body>
</html>
