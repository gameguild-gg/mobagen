<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DICOM Renderer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 800px;
            height: 600px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a2a4a;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.95);
            border: 2px solid #0f0;
            padding: 15px;
            border-radius: 5px;
            z-index: 100;
            max-width: 220px;
        }

        #controls h3 {
            color: #0f0;
            margin-bottom: 10px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status {
            color: #0f0;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 8px;
            background: #0a3a0a;
            border: 1px solid #0f0;
            border-radius: 3px;
        }

        button {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #1a1a1a;
            color: #888;
            border: 1px solid #444;
            border-radius: 3px;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        button.active {
            background: #0a3a0a;
            color: #0f0;
            border-color: #0f0;
        }

        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.95);
            border: 2px solid #0f0;
            padding: 15px;
            border-radius: 5px;
            color: #0f0;
            font-size: 12px;
            text-align: right;
            z-index: 100;
        }

        #stats div {
            margin: 5px 0;
        }

        #stat-fps {
            font-weight: bold;
            font-size: 13px;
        }

        .tiny-banner {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a3a0a;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 10px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="tiny-banner" id="webgpu-banner">✓ WebGPU</div>

    <div id="container">
        <canvas id="canvas"></canvas>

        <div id="controls">
            <h3>🎮 Renderer</h3>
            <div id="status">WebGL (G2)</div>
            <button id="btn-webgl" class="active" onclick="switchRenderer('webgl')">► WebGL: Triangle</button>
            <button id="btn-webgpu" onclick="switchRenderer('webgpu')">► WebGPU: Quad</button>

            <h3 style="margin-top: 12px;">🎨 Colors</h3>
            <button id="color-1" class="active" onclick="switchColor(1)">1: Teal</button>
            <button id="color-2" onclick="switchColor(2)">2: Red</button>
            <button id="color-3" onclick="switchColor(3)">3: Green</button>
            <button id="color-4" onclick="switchColor(4)">4: Yellow</button>
        </div>

        <div id="stats">
            <div id="stat-renderer">Renderer: WebGL (G2)</div>
            <div id="stat-fps" style="color: #0f0;">FPS: 60</div>
            <div id="stat-frametime" style="font-size: 10px; color: #888;">Frame: 16.7ms</div>
        </div>
    </div>

    <script>
        var Module = { canvas: document.getElementById('canvas') };

        // ====================================================================
        // PERFORMANCE STATS TRACKING
        // ====================================================================
        class PerformanceStats {
            constructor() {
                this.frameCount = 0;
                this.lastTime = performance.now();
                this.lastFpsTime = this.lastTime;
                this.fps = 60;
                this.frameTime = 16.7;
                this.currentRenderer = 'webgl';
            }

            update() {
                const now = performance.now();
                const delta = now - this.lastTime;
                this.frameTime = delta;
                this.lastTime = now;
                this.frameCount++;

                if (now - this.lastFpsTime >= 500) {
                    this.fps = Math.round((this.frameCount / (now - this.lastFpsTime)) * 1000);
                    this.frameCount = 0;
                    this.lastFpsTime = now;
                    this.updateDisplay();
                }
            }

            setRenderer(renderer) {
                this.currentRenderer = renderer;
                this.updateDisplay();
            }

            updateDisplay() {
                const rendererName = this.currentRenderer === 'webgl' ? 'WebGL (G2)' : 'WebGPU (G3)';
                const fpsColor = this.fps >= 55 ? '#0f0' : this.fps >= 30 ? '#ff0' : '#f00';

                document.getElementById('stat-renderer').textContent = `Renderer: ${rendererName}`;
                document.getElementById('stat-fps').textContent = `FPS: ${this.fps}`;
                document.getElementById('stat-fps').style.color = fpsColor;
                document.getElementById('stat-frametime').textContent = `Frame: ${this.frameTime.toFixed(1)}ms`;
            }
        }

        const stats = new PerformanceStats();
        stats.updateDisplay();

        function statsLoop() {
            stats.update();
            requestAnimationFrame(statsLoop);
        }
        statsLoop();

        function switchRenderer(renderer) {
            console.log(`→ Switching to: ${renderer.toUpperCase()}`);
            if (typeof Module._set_renderer === 'function') {
                Module._set_renderer(renderer);
                stats.setRenderer(renderer);

                const displayName = renderer === 'webgl' ? 'WebGL (G2)' : 'WebGPU (G3)';
                document.getElementById('status').textContent = displayName;

                document.getElementById('btn-webgl').classList.toggle('active', renderer === 'webgl');
                document.getElementById('btn-webgpu').classList.toggle('active', renderer === 'webgpu');
            }
        }

        function switchColor(num) {
            console.log(`→ Switching color: ${num}`);
            if (typeof Module._set_shader_variant === 'function') {
                Module._set_shader_variant(num);

                for (let i = 1; i <= 4; i++) {
                    document.getElementById(`color-${i}`).classList.toggle('active', i === num);
                }
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') switchColor(1);
            if (e.key === '2') switchColor(2);
            if (e.key === '3') switchColor(3);
            if (e.key === '4') switchColor(4);
        });

        // Initialize
        switchColor(1);

        console.log('═══════════════════════════════════════════');
        console.log('DICOM Renderer Controls:');
        console.log('─────────────────────────────────────────');
        console.log('Renderer Switch: Click buttons (WebGL/WebGPU)');
        console.log('Color Variants: Press 1/2/3/4 (or click)');
        console.log('═══════════════════════════════════════════');

        // ====================================================================
        // WebGPU Support Detection
        // ====================================================================
        function detectWebGPUSupport() {
            if (!navigator.gpu) {
                return {
                    supported: false,
                    browser: detectBrowser(),
                    message: "WebGPU not available in this browser"
                };
            }
            return {
                supported: true,
                browser: detectBrowser(),
                message: "WebGPU supported!"
            };
        }

        function detectBrowser() {
            const ua = navigator.userAgent;
            if (ua.includes('Chrome') && !ua.includes('Chromium')) {
                return 'Chrome';
            } else if (ua.includes('Firefox')) {
                return 'Firefox';
            } else if (ua.includes('Safari') && !ua.includes('Chrome')) {
                return 'Safari';
            } else if (ua.includes('Edge')) {
                return 'Edge';
            }
            return 'Unknown';
        }

        // Update banner
        const support = detectWebGPUSupport();
        const banner = document.getElementById('webgpu-banner');
        if (support.supported) {
            banner.textContent = `✓ WebGPU (${support.browser})`;
            banner.style.background = '#0a3a0a';
            banner.style.borderColor = '#0f0';
            banner.style.color = '#0f0';
        } else {
            banner.textContent = `✗ WebGPU (${support.browser})`;
            banner.style.background = '#3a0a0a';
            banner.style.borderColor = '#f00';
            banner.style.color = '#f00';
        }
    </script>

    <!-- WebGPU G3 Implementation -->
    <script>
const WGSL_SHADER = `
struct VertexInput {
  @location(0) position: vec2f,
};

@vertex
fn vs_main(in: VertexInput) -> @builtin(position) vec4f {
  return vec4f(in.position, 0.0, 1.0);
}

@fragment
fn fs_main() -> @location(0) vec4f {
  return vec4f(0.0, 1.0, 0.5, 1.0);
}
`;

window.webgpuState = {
    device: null,
    queue: null,
    pipeline: null,
    vertexBuffer: null,
    canvas: document.getElementById('canvas'),
    context: null,
    initialized: false
};

async function initWebGPU() {
    if (window.webgpuState.initialized) return true;
    if (!navigator.gpu) {
        console.error("WebGPU not supported");
        return false;
    }

    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            console.error("GPU adapter not found");
            return false;
        }

        const device = await adapter.requestDevice();
        window.webgpuState.device = device;
        window.webgpuState.queue = device.queue;

        const canvas = window.webgpuState.canvas;
        const context = canvas.getContext('webgpu');
        if (!context) {
            console.error("Could not get WebGPU context");
            return false;
        }

        const format = navigator.gpu.getPreferredCanvasFormat();
        context.configure({
            device: device,
            format: format,
        });
        window.webgpuState.context = context;
        window.webgpuState.format = format;

        const shader = device.createShaderModule({
            code: WGSL_SHADER
        });

        // WebGPU: Quad (4 vertices)
        const vertices = new Float32Array([
            -0.5,  0.5,   // Top-left
             0.5,  0.5,   // Top-right
             0.5, -0.5,   // Bottom-right
            -0.5, -0.5    // Bottom-left
        ]);

        const vertexBuffer = device.createBuffer({
            size: vertices.byteLength,
            usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            mappedAtCreation: true,
        });
        new Float32Array(vertexBuffer.getMappedRange()).set(vertices);
        vertexBuffer.unmap();
        window.webgpuState.vertexBuffer = vertexBuffer;

        const pipeline = device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module: shader,
                entryPoint: 'vs_main',
                buffers: [{
                    arrayStride: 8,
                    attributes: [{
                        shaderLocation: 0,
                        offset: 0,
                        format: 'float32x2',
                    }],
                }],
            },
            fragment: {
                module: shader,
                entryPoint: 'fs_main',
                targets: [{ format: format }],
            },
            primitive: { topology: 'triangle-list' },
        });
        window.webgpuState.pipeline = pipeline;
        window.webgpuState.initialized = true;
        console.log("WebGPU initialized successfully");
        return true;
    } catch (e) {
        console.error("WebGPU initialization error:", e);
        return false;
    }
}

function renderFrame() {
    if (!window.webgpuState.device || !window.webgpuState.pipeline) return;

    const state = window.webgpuState;
    const device = state.device;
    const queue = state.queue;
    const context = state.context;

    const commandEncoder = device.createCommandEncoder();
    const textureView = context.getCurrentTexture().createView();
    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: textureView,
            clearValue: { r: 0.1, g: 0.2, b: 0.5, a: 1.0 },
            loadOp: 'clear',
            storeOp: 'store',
        }],
    });

    renderPass.setPipeline(state.pipeline);
    renderPass.setVertexBuffer(0, state.vertexBuffer);
    renderPass.draw(4, 1, 0, 0);  // Draw quad (4 vertices)
    renderPass.end();
    queue.submit([commandEncoder.finish()]);
}

window.addEventListener('DOMContentLoaded', () => {
    const support = detectWebGPUSupport();
    console.log(`WebGPU Support: ${support.supported ? '✓' : '✗'} (${support.browser})`);

    if (!support.supported) return;

    initWebGPU().then(success => {
        if (success) {
            console.log('WebGPU initialized successfully');
            const animLoop = () => {
                renderFrame();
                requestAnimationFrame(animLoop);
            };
            requestAnimationFrame(animLoop);
        } else {
            console.error('Failed to initialize WebGPU');
        }
    }).catch(e => {
        console.error('WebGPU initialization error:', e);
    });
});

window.webgpu_render = renderFrame;
window.webgpu_init = initWebGPU;
    </script>

    {{{ SCRIPT }}}
</body>
</html>
