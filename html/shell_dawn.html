<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DICOM Renderer — WebGPU (Dawn)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background:#111; height:100vh; overflow:hidden; font-family:monospace; }
        #container { position:relative; width:100%; height:100%; }
        /* The C++ side (Dawn) owns this canvas; the UI is ImGui, drawn in-canvas. */
        canvas { display:block; width:100%; height:100%; background:#1a2a4a; outline:none; }
        #startup-status {
            position:absolute; left:12px; bottom:12px; z-index:10;
            max-width:min(560px, calc(100vw - 24px));
            padding:10px 12px; border:1px solid #4977b7; border-radius:4px;
            background:rgba(5,9,16,.92); color:#dbeafe; font-size:13px;
        }
        #startup-status.error { border-color:#ff5a5a; color:#ffd6d6; }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas" tabindex="0"></canvas>
        <div id="startup-status">Loading WebGPU renderer...</div>
    </div>

    <script>
        // emdawnwebgpu creates its surface from the element with id "canvas".
        var Module = { canvas: document.getElementById('canvas') };

        const canvas = document.getElementById('canvas');
        const container = document.getElementById('container');
        const startupStatus = document.getElementById('startup-status');
        let wasmRuntimeReady = false;

        window.mobagenSetStatus = function(kind, message) {
            startupStatus.textContent = message;
            startupStatus.className = kind === 'error' ? 'error' : '';
            startupStatus.style.display = kind === 'ready' ? 'none' : 'block';
        };

        function notifyNativeResize() {
            // Emscripten exposes _on_canvas_resize before the runtime is fully
            // initialized, but calling that early aborts the program. The HTML
            // canvas size can be prepared immediately; the C++ viewport update
            // waits until onRuntimeInitialized marks the module as callable.
            if (wasmRuntimeReady && typeof Module._on_canvas_resize === 'function') {
                Module._on_canvas_resize(canvas.width, canvas.height);
            }
        }

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;  // layout not ready
            const dpr = window.devicePixelRatio || 1;
            canvas.width  = Math.max(1, Math.round(rect.width  * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            notifyNativeResize();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        canvas.addEventListener('pointerdown', () => canvas.focus());
        // SDL_CreateWindow resets the canvas during WASM startup, so re-sync once ready.
        Module.onRuntimeInitialized = () => {
            wasmRuntimeReady = true;
            canvas.focus();
            resizeCanvas();
        };
        resizeCanvas();
    </script>

    {{{ SCRIPT }}}
</body>
</html>
