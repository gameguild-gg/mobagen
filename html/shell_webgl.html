<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>DICOM Renderer — WebGL2 (G2)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background:#111; height:100vh; font-family:monospace; overflow:hidden; }
        #container { position:relative; width:100%; height:100%; }
        canvas { display:block; width:100%; height:100%; background:#1a2a4a; }
        .panel {
            position:absolute; background:rgba(0,0,0,0.95);
            border:2px solid #0f0; border-radius:5px; padding:12px; z-index:100; color:#0f0;
        }
        #controls {
            top:10px; left:10px; width:220px; max-width:calc(100vw - 20px);
            max-height:calc(100vh - 20px); overflow-y:auto;
        }
        #stats    { top:10px; right:10px; text-align:right; font-size:12px; }
        h3 { font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
        button {
            display:block; width:100%; padding:6px; margin:4px 0; background:#1a1a1a; color:#888;
            border:1px solid #444; border-radius:3px; cursor:pointer; font-family:monospace;
            font-size:11px; font-weight:bold; transition:all .15s;
        }
        button:hover { transform:scale(1.02); }
        button.active { background:#0a3a0a; color:#0f0; border-color:#0f0; }
        #stat-fps { font-weight:bold; font-size:13px; }
        .hint { font-size:10px; color:#888; margin-top:8px; line-height:1.5; }
        .row-label { font-size:10px; margin-top:6px; }
        input[type="range"] { width:100%; accent-color:#0f0; }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas" tabindex="0"></canvas>

        <div id="controls" class="panel">
            <h3>WebGL2 · G2</h3>
            <h3 style="margin-top:4px;">Transfer function</h3>
            <button id="color-1" class="active" onclick="setColor(1)">1: Gray</button>
            <button id="color-2" onclick="setColor(2)">2: Tissue</button>
            <button id="color-3" onclick="setColor(3)">3: Shell</button>
            <button id="color-4" onclick="setColor(4)">4: Cool</button>
            <h3 style="margin-top:10px;">Mode</h3>
            <button id="mode-0" class="active" onclick="setMode(0)">DVR</button>
            <button id="mode-1" onclick="setMode(1)">MIP</button>
            <button id="mode-2" onclick="setMode(2)">Isosurface</button>
            <h3 style="margin-top:10px;">Window</h3>
            <div class="row-label">Center <span id="win-cl">0.50</span></div>
            <input id="win-c" type="range" min="0" max="1" step="0.01" value="0.5"
                   oninput="updateWindow()">
            <div class="row-label">Width <span id="win-wl">1.00</span></div>
            <input id="win-w" type="range" min="0.02" max="1" step="0.01" value="1"
                   oninput="updateWindow()">
            <h3 style="margin-top:10px;">Ray debug</h3>
            <button id="debug-0" class="active" onclick="setDebug(0)">Final image</button>
            <button id="debug-1" onclick="setDebug(1)">Ray direction</button>
            <button id="debug-2" onclick="setDebug(2)">Ray depth</button>
            <button id="debug-3" onclick="setDebug(3)">Sample count</button>
            <h3 style="margin-top:10px;">Sampling</h3>
            <div class="row-label">Steps <span id="steps-l">128</span></div>
            <input id="steps" type="range" min="16" max="512" step="16" value="128"
                   oninput="updateSampling()">
            <div class="row-label">Opacity <span id="opacity-l">0.20</span></div>
            <input id="opacity" type="range" min="0.01" max="1" step="0.01" value="0.2"
                   oninput="updateSampling()">
            <div class="hint">
                Hold mouse + drag: rotate<br>
                Right/middle drag: pan<br>
                Wheel: zoom<br>
                C: ORBIT / WASD<br>
                R: reset · P: pointer lock<br>
                WASD + Space + Shift/Ctrl: move
            </div>
        </div>

        <div id="stats" class="panel">
            <div id="stat-renderer">WebGL2 (G2)</div>
            <div id="stat-fps">FPS: 60</div>
            <div id="stat-frametime" style="font-size:10px; color:#888;">Frame: 16.7ms</div>
        </div>
    </div>

    <script>
        var Module = { canvas: document.getElementById('canvas') };

        // ---- Performance stats ------------------------------------------------
        let frameCount = 0, lastTime = performance.now(), lastFpsTime = lastTime;
        function statsLoop() {
            const now = performance.now();
            const frameTime = now - lastTime;
            lastTime = now; frameCount++;
            if (now - lastFpsTime >= 500) {
                const fps = Math.round(frameCount / (now - lastFpsTime) * 1000);
                frameCount = 0; lastFpsTime = now;
                const c = fps >= 55 ? '#0f0' : fps >= 30 ? '#ff0' : '#f00';
                const el = document.getElementById('stat-fps');
                el.textContent = `FPS: ${fps}`; el.style.color = c;
                document.getElementById('stat-frametime').textContent =
                    `Frame: ${frameTime.toFixed(1)}ms`;
            }
            requestAnimationFrame(statsLoop);
        }
        statsLoop();

        // ---- Canvas resize ----------------------------------------------------
        const canvas = document.getElementById('canvas');
        const container = document.getElementById('container');
        let wasmRuntimeReady = false;

        function notifyNativeResize() {
            // The HTML canvas can resize before the WASM runtime is ready. The
            // exported C++ function exists as a stub at that point, but calling
            // it early aborts the module, so the native viewport update is gated.
            if (wasmRuntimeReady && typeof Module._on_canvas_resize === 'function') {
                Module._on_canvas_resize(canvas.width, canvas.height);
            }
        }

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;  // layout not ready
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));
            console.log('[resize] canvas', canvas.width, canvas.height);
            notifyNativeResize();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        canvas.addEventListener('pointerdown', () => canvas.focus());
        resizeCanvas();
        // SDL_CreateWindow resets the canvas to its initial size during WASM
        // startup, so re-sync to the real window size once the module is ready.
        Module.onRuntimeInitialized = () => {
            wasmRuntimeReady = true;
            canvas.focus();
            resizeCanvas();
        };

        // ---- Color variants (calls into C++) ----------------------------------
        function setColor(num) {
            if (typeof Module._set_shader_variant === 'function') {
                Module._set_shader_variant(num);
                for (let i = 1; i <= 4; i++) {
                    document.getElementById(`color-${i}`).classList.toggle('active', i === num);
                }
            }
        }
        function setMode(m) {
            if (typeof Module._set_render_mode === 'function') {
                Module._set_render_mode(m);
                for (let i = 0; i <= 2; i++) {
                    document.getElementById(`mode-${i}`).classList.toggle('active', i === m);
                }
            }
        }
        function updateWindow() {
            const c = parseFloat(document.getElementById('win-c').value);
            const w = parseFloat(document.getElementById('win-w').value);
            document.getElementById('win-cl').textContent = c.toFixed(2);
            document.getElementById('win-wl').textContent = w.toFixed(2);
            if (typeof Module._set_window === 'function') Module._set_window(c, w);
        }
        function setDebug(mode) {
            if (typeof Module._set_debug_mode === 'function') {
                Module._set_debug_mode(mode);
                for (let i = 0; i <= 3; i++) {
                    document.getElementById(`debug-${i}`).classList.toggle('active', i === mode);
                }
            }
        }
        function updateSampling() {
            const steps = parseInt(document.getElementById('steps').value, 10);
            const opacity = parseFloat(document.getElementById('opacity').value);
            document.getElementById('steps-l').textContent = steps;
            document.getElementById('opacity-l').textContent = opacity.toFixed(2);
            if (typeof Module._set_sampling === 'function') {
                Module._set_sampling(steps, opacity);
            }
        }
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '4') setColor(parseInt(e.key));
        });
    </script>

    {{{ SCRIPT }}}
</body>
</html>
